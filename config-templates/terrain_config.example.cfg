[opentopography]

; Optional: 30 m SRTM via OpenTopography (default DEM is Open-Meteo, no key).
; Free key: https://portal.opentopography.org/
api_key="YOUR_OPENTOPOGRAPHY_API_KEY"

[terrain]

; Optional terrain extent defaults (metres). 0 or omitted = use built-in defaults.
; world_half_extent_m=15000
; detail_half_extent_m=1500
; osm_half_extent_m=1500
; base_dem_grid_n=64
